<svg width="56" height="56" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldPrimary" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCE39C" />
      <stop offset="35%" stop-color="#D4A843" />
      <stop offset="70%" stop-color="#B58524" />
      <stop offset="100%" stop-color="#F2CE74" />
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF2C2" />
      <stop offset="100%" stop-color="#C8962E" />
    </linearGradient>

    <!-- Deep Forest Green Background -->
    <radialGradient id="emeraldBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#234839" />
      <stop offset="65%" stop-color="#142C22" />
      <stop offset="100%" stop-color="#0B1913" />
    </radialGradient>

    <!-- Warm Cream Architecture Gradient -->
    <linearGradient id="creamTower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="50%" stop-color="#E2DACB" />
      <stop offset="100%" stop-color="#BFB5A2" />
    </linearGradient>

    <!-- Soft Sun Halo -->
    <radialGradient id="sunAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6D57E" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#D4A843" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#D4A843" stop-opacity="0" />
    </radialGradient>

    <clipPath id="emblemClip">
      <circle cx="100" cy="100" r="86" />
    </clipPath>
  </defs>

  <!-- Outer Emblem Frame & Ornamental Ring -->
  <circle cx="100" cy="100" r="95" fill="#0B1913" stroke="url(#goldPrimary)" stroke-width="4" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#goldPrimary)" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" />
  <circle cx="100" cy="100" r="86" fill="url(#emeraldBg)" />

  <g clip-path="url(#emblemClip)">
    <!-- Sky Glow & Subtle Shanyrak Sun Rays -->
    <circle cx="100" cy="64" r="54" fill="url(#sunAura)" />
    <g stroke="#D4A843" stroke-width="0.9" opacity="0.22">
      <line x1="100" y1="12" x2="100" y2="116" />
      <line x1="48" y1="64" x2="152" y2="64" />
      <line x1="63" y1="27" x2="137" y2="101" />
      <line x1="137" y1="27" x2="63" y2="101" />
      <circle cx="100" cy="64" r="34" fill="none" />
      <circle cx="100" cy="64" r="44" fill="none" stroke-dasharray="4 4" />
    </g>

    <!-- Distant & Midground Altai Mountains -->
    <path d="M92 146 L132 76 L154 112 L172 84 L196 146 Z" fill="#1C3A2E" />
    <path d="M104 146 L138 88 L158 118 L175 94 L196 146 Z" fill="#152D23" />
    <!-- Snow Caps -->
    <path d="M132 76 L121 96 L128 92 L133 98 L139 91 L144 95 Z" fill="#EDE7DC" opacity="0.9" />
    <path d="M172 84 L163 99 L169 96 L173 101 L179 96 Z" fill="#EDE7DC" opacity="0.8" />

    <!-- Baiterek Tower (Architectural Detail) -->
    <g transform="translate(2, 2)">
      <!-- Lower Pedestal -->
      <path d="M87 152 L92 126 L108 126 L113 152 Z" fill="url(#creamTower)" />
      <path d="M90 138 L110 138" stroke="#142C22" stroke-width="1.2" />

      <!-- Outer Curving Steel Ribs -->
      <path d="M92 126 C92 104, 86 80, 79 62 L83 62 C89 80, 95 104, 95 126 Z" fill="url(#creamTower)" />
      <path d="M108 126 C108 104, 114 80, 121 62 L117 62 C111 80, 105 104, 105 126 Z" fill="url(#creamTower)" />

      <!-- Inner Lattice Cross-Bracing -->
      <path d="M96 126 L94 64 L98 64 L99 126 Z" fill="#D5CCB9" />
      <path d="M104 126 L106 64 L102 64 L101 126 Z" fill="#D5CCB9" />
      <path d="M91 108 L109 96 M109 108 L91 96 M89 88 L111 76 M111 88 L89 76" stroke="#F4EFE6" stroke-width="1.1" opacity="0.85" />

      <!-- Crown Flare -->
      <path d="M76 59 L88 68 L100 63 L112 68 L124 59 L111 61 L100 54 L89 61 Z" fill="url(#creamTower)" />

      <!-- Golden Sphere & Highlights -->
      <circle cx="100" cy="49" r="13.5" fill="url(#goldPrimary)" stroke="#142C22" stroke-width="1" />
      <path d="M90 45 A 11 11 0 0 1 108 41" fill="none" stroke="#FFF6D6" stroke-width="2" stroke-linecap="round" opacity="0.85" />
      <circle cx="95" cy="44" r="2.2" fill="#FFF9E6" />
    </g>

    <!-- Detailed Golden Steppe Eagle -->
    <g>
      <!-- Upper Primary Wing Feathers -->
      <path d="M24 62 C44 68, 62 82, 78 98 C60 91, 40 82, 22 72 C36 86, 55 96, 75 104 C56 102, 38 96, 26 88 C42 102, 60 110, 80 113 C64 115, 49 112, 36 107 C53 121, 74 126, 96 123 C109 121, 120 115, 130 109 C135 106, 141 106, 146 110 C143 103, 137 100, 130 101 C126 101, 123 103, 119 104 C107 107, 94 103, 82 93 C64 78, 45 66, 24 62 Z" fill="url(#goldPrimary)" />

      <!-- Inner Wing Ornamentation & Feather Separation Lines -->
      <path d="M35 71 C51 79, 65 89, 77 99" stroke="#142C22" stroke-width="1.3" stroke-linecap="round" opacity="0.65" />
      <path d="M38 86 C52 94, 65 101, 77 106" stroke="#142C22" stroke-width="1.3" stroke-linecap="round" opacity="0.65" />
      <path d="M46 101 C58 108, 70 112, 82 114" stroke="#142C22" stroke-width="1.3" stroke-linecap="round" opacity="0.65" />

      <!-- Eagle Eye & Beak Highlight -->
      <circle cx="133" cy="104.5" r="1.3" fill="#0B1913" />
    </g>

    <!-- Foreground Steppe Hills & Kazakh Ornamental Wave -->
    <path d="M12 144 Q 58 124, 102 142 T 190 136 L 190 192 L 12 192 Z" fill="#0E2018" />
    <path d="M12 144 Q 58 124, 102 142 T 190 136" fill="none" stroke="url(#goldHighlight)" stroke-width="3" />

    <!-- Traditional Koshkar-Muiz (Ram's Horn) Scroll Accent at Bottom -->
    <path d="M100 153 C92 153, 87 159, 90 165 C92 169, 97 169, 98 165 C99 162, 96 160, 94 162 M100 153 C108 153, 113 159, 110 165 C108 169, 103 169, 102 165 C101 162, 104 160, 106 162" fill="none" stroke="url(#goldPrimary)" stroke-width="2.2" stroke-linecap="round" />
    <path d="M74 158 C82 154, 91 153, 100 153 C109 153, 118 154, 126 158" fill="none" stroke="url(#goldPrimary)" stroke-width="1.6" stroke-linecap="round" opacity="0.85" />
  </g>
</svg>